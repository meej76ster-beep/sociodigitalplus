        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : (this.memory[key] || null);
        } catch(e) {
          return this.memory[key] || null;
        }

        this.memory[key] = val;

    function getSanitizedState() {
      const stored = SafeStore.get('sd_master_state_v5');
      if (!stored) return JSON.parse(JSON.stringify(DEFAULT_STATE));

      return {
        isAuth: !!stored.isAuth,
        user: {
          name: (stored.user && stored.user.name) ? stored.user.name : '',
          email: (stored.user && stored.user.email) ? stored.user.email : ''
        },
        currentTab: (['home', 'path', 'profile'].includes(stored.currentTab)) ? stored.currentTab : 'home',
        progress: {
          completedLessons: Array.isArray(stored.progress?.completedLessons) ? stored.progress.completedLessons : [],
          level1Passed: !!stored.progress?.level1Passed,
          level1Score: Number(stored.progress?.level1Score) || 0,
          level2Passed: !!stored.progress?.level2Passed,
          level2Score: Number(stored.progress?.level2Score) || 0,
          xp: Number(stored.progress?.xp) || 0,

        },
        activeLesson: stored.activeLesson || null,

        tutorOpen: !!stored.tutorOpen,
        tutorMessages: Array.isArray(stored.tutorMessages) && stored.tutorMessages.length > 0 
          ? stored.tutorMessages 
          : DEFAULT_STATE.tutorMessages
      };
    }

    let state = getSanitizedState();

    function saveState() {
      SafeStore.set('sd_master_state_v5', state);

    function calculateProgress() {
      const totalLessons = 11;
      const count = state.progress.completedLessons.length;
      let p = (count / totalLessons) * 70;
      if (state.progress.level1Passed) p += 15;
      if (state.progress.level2Passed) p += 15;
      return Math.min(100, Math.round(p));
    }

    function safeRender(renderFn) {
      try {
        const html = renderFn();
        return html ? html : '<div class="p-5 text-center text-red-500">Error interno en la vista.</div>';
      } catch (error) {
        console.error("Error en renderizado:", error);
        return `<div class="p-5 text-center text-red-500 bg-red-50 border border-red-300 rounded-xl m-4">Error cargando pantalla: ${error.message}</div>`;
      }
    }

              <span class="bg-brand-gold/15 text-brand-dark text-[10px] font-black px-2.5 py-1 rounded uppercase">4. Interactúa</span>
              <p class="text-xs md:text-sm font-bold text-brand-dark">${lsn.interactPrompt}</p>
              <div class="space-y-2" id="lesson-interact-box">
                ${lsn.interactOptions.map(opt => `
                  <button
                    onclick="checkInteractOption('${opt.replace(/'/g, "\\'")}')"
                    class="w-full text-left p-3 rounded-xl border border-brand-gray bg-brand-white text-xs md:text-sm hover:bg-brand-beige font-medium transition cursor-pointer"
                  >
                    ${opt}
                  </button>
                `).join('')}
              </div>
            </div>
          ` : step === 5 ? `
            <div class="space-y-3">
              <span class="bg-brand-gold/15 text-brand-dark text-[10px] font-black px-2.5 py-1 rounded uppercase">5. Comprueba</span>
              <p class="text-xs md:text-sm font-bold text-brand-dark">${lsn.checkQuestion}</p>
              <div class="grid grid-cols-2 gap-2" id="lesson-check-box">
                ${lsn.checkOptions.map(opt => `
                  <button
                    onclick="checkCheckOption('${opt.replace(/'/g, "\\'")}')"
                    class="p-3 rounded-xl border border-brand-gray bg-brand-white text-xs md:text-sm font-bold hover:bg-brand-beige text-center transition cursor-pointer"
                  >
                    ${opt}
                  </button>
                `).join('')}
              </div>
            </div>
          ` : step === 6 ? `
            <div class="space-y-3">
              <span class="bg-brand-gold/15 text-brand-dark text-[10px] font-black px-2.5 py-1 rounded uppercase">6. Aplica</span>
              <div class="bg-brand-beige p-4 rounded-2xl border border-brand-gray">
                <h4 class="text-xs font-bold text-brand-dark uppercase mb-1">Desafío Inmediato:</h4>
                <p class="text-xs md:text-sm text-brand-black/90 leading-relaxed">${lsn.apply}</p>
              </div>
            </div>
          ` : `
            <div class="text-center py-6 space-y-3">
              <span class="text-5xl inline-block animate-bounce">🎉</span>
              <h3 class="text-base md:text-lg font-black text-brand-dark">¡Microlección Completada!</h3>
              <p class="text-xs text-brand-black/70">Has fortalecido las bases para construir tu Socio Digital.</p>
              <div class="inline-block bg-brand-gold/20 text-brand-dark font-black text-xs px-3.5 py-1.5 rounded-full border border-brand-gold">
                +${lsn.xpReward} XP Obtenidos
              </div>
            </div>
          `}

          <div class="pt-4">
            <button
              onclick="nextLessonStep()"
              class="w-full bg-brand-gold hover:bg-brand-dark hover:text-brand-white text-brand-dark font-extrabold text-xs md:text-sm py-3.5 px-4 rounded-xl border-2 border-brand-dark transition shadow-gold uppercase tracking-wider cursor-pointer"
            >
              ${step === totalSteps ? 'Finalizar Lección' : 'Continuar'}
            </button>
          </div>
        </div>
      `;
    }

    function renderAssessmentView() {
      if (!state.activeAssessment) {
        return '<div class="text-center py-8"><button onclick="closeAssessment()" class="bg-brand-dark text-white text-xs p-3 rounded-xl cursor-pointer">Volver</button></div>';
      }

      const lvl = COURSE_DATA.find(l => l.id === state.activeAssessment.levelId);
      const res = state.activeAssessment.result;

      if (!lvl || !lvl.assessment) {
        return '<div class="text-center py-8"><button onclick="closeAssessment()" class="bg-brand-dark text-white text-xs p-3 rounded-xl cursor-pointer">Volver al Mapa</button></div>';
      }

      return `
        <div class="bg-brand-white rounded-3xl p-5 md:p-8 border border-brand-gray shadow-card space-y-4 fade-in max-w-2xl mx-auto pb-10">
          <div class="flex justify-between items-center pb-2 border-b border-brand-gray">
            <div>
              <span class="text-[9px] font-black text-brand-gold uppercase tracking-wider block">Evaluación Formativa</span>
              <h2 class="text-sm md:text-base font-black text-brand-dark">${lvl.title}</h2>
            </div>
            <button onclick="closeAssessment()" class="text-xs font-bold text-brand-dark px-2.5 py-1 bg-brand-beige hover:bg-brand-gold/20 rounded-lg cursor-pointer">
              Cerrar
            </button>
          </div>

          ${!res ? `
            <div class="space-y-4">
              <div class="bg-brand-beige/60 p-3.5 rounded-xl border border-brand-gray text-xs text-brand-dark">
                <strong>Requisito de Aprobación:</strong> Mínimo <strong>80%</strong> de aciertos para desbloquear el siguiente nivel.
              </div>

              <form id="assessment-form" onsubmit="submitAssessment(event)" class="space-y-4">
                ${lvl.assessment.questions.map((q, idx) => `
                  <div class="border border-brand-gray rounded-2xl p-4 bg-brand-white space-y-2">
                    <span class="text-[9px] font-black text-brand-gold uppercase">Pregunta ${idx + 1} de ${lvl.assessment.questions.length}</span>
                    <p class="text-xs md:text-sm font-bold text-brand-dark leading-relaxed">${q.prompt}</p>
                    <div class="space-y-1.5 pt-1">
                      ${q.options.map(opt => `
                        <label class="flex items-center gap-2 p-2.5 rounded-xl border border-brand-gray/70 bg-brand-beige/30 text-xs md:text-sm text-brand-dark cursor-pointer hover:bg-brand-gold/10 transition">
                          <input type="radio" name="${q.id}" value="${opt.replace(/"/g, '&quot;')}" required class="text-brand-gold focus:ring-brand-gold" />
                          <span>${opt}</span>
                        </label>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}

                <button
                  type="submit"
                  class="w-full bg-brand-gold hover:bg-brand-dark hover:text-brand-white text-brand-dark font-extrabold text-xs md:text-sm py-3.5 px-4 rounded-xl border-2 border-brand-dark transition shadow-gold uppercase tracking-wider cursor-pointer"
                >
                  Entregar Evaluación
                </button>
              </form>
            </div>
          ` : `
            <div class="text-center space-y-4">
              <span class="text-5xl inline-block">${res.passed ? '🏆' : '📚'}</span>
              <h3 class="text-base md:text-lg font-black text-brand-dark">
                ${res.passed ? '¡Nivel Aprobado!' : 'Nivel No Aprobado'}
              </h3>
              <div class="bg-brand-beige p-4 rounded-2xl border border-brand-gray">
                <div class="text-3xl font-black text-brand-dark">${res.score}%</div>
                <p class="text-xs text-brand-black/70 mt-1">
                  ${res.passed 
                    ? '¡Felicitaciones! Has superado el 80% requerido y desbloqueado el siguiente nivel.' 
                    : 'Has obtenido menos del 80%. Revisa la retroalimentación y vuelve a intentarlo.'}
                </p>
              </div>

              <div class="text-left space-y-2 pt-2">
                <h4 class="text-xs font-black text-brand-dark uppercase">Retroalimentación Detallada:</h4>
                ${lvl.assessment.questions.map((q, idx) => {
                  const fb = res.details[q.id];
                  return `
                    <div class="p-3 rounded-xl border text-xs ${
                      fb && fb.isCorrect 
                        ? 'bg-brand-success/15 border-brand-success text-brand-dark' 
                        : 'bg-brand-error/15 border-brand-error text-brand-dark'
                    }">
                      <div class="font-bold">${idx + 1}. ${fb && fb.isCorrect ? '✓ Correcto' : '✗ Requiere Revisión'}</div>
                      <div class="text-xs mt-0.5">${fb ? fb.explanation : ''}</div>
                    </div>
                  `;
                }).join('')}
              </div>

              <button
                onclick="closeAssessment()"
                class="w-full bg-brand-dark text-brand-white font-extrabold text-xs md:text-sm py-3.5 rounded-xl border border-brand-gold uppercase tracking-wider cursor-pointer"
              >
                Volver al Mapa
              </button>
            </div>
          `}
        </div>
      `;
    }

              <div class="p-3 rounded-2xl border ${state.progress.level2Passed ? 'bg-brand-gold/15 border-brand-gold' : 'bg-brand-beige/40 border-brand-gray opacity-40'}">

            <button

            >
              <span>Reiniciar Progreso de Aprendizaje</span>

            <button
              onclick="logout()"
              class="w-full text-left p-3 rounded-xl bg-brand-dark text-brand-white text-xs font-bold flex justify-between items-center transition cursor-pointer"
            >

              <span>🚪</span>

    function renderTutorWidget() {
      return `
        <!-- Botón Flotante Permanente -->
        <button
          onclick="toggleTutor()"
          class="fixed bottom-20 md:bottom-8 right-4 md:right-8 z-40 bg-brand-gold text-brand-dark p-3.5 rounded-full border-2 border-brand-dark shadow-gold flex items-center gap-2 font-black text-xs hover:scale-105 transition cursor-pointer"
        >
          <span class="text-xl">🤖</span>
          <span class="font-bold">Tutor IA</span>
        </button>

        <!-- Ventana de Chat del Tutor -->
        ${state.tutorOpen ? `
          <div class="fixed bottom-24 md:bottom-24 right-4 md:right-8 w-[92vw] sm:w-80 md:w-96 max-w-sm h-96 bg-brand-white border-2 border-brand-gold rounded-3xl shadow-2xl z-50 flex flex-col overflow-hidden fade-in">
            <div class="bg-brand-dark p-3 text-brand-white flex justify-between items-center border-b border-brand-gold">
              <div class="flex items-center gap-2">
                <span class="text-lg">🤖</span>
                <div>
                  <h4 class="text-xs font-bold">Tu Socio Tutor</h4>
                  <span class="text-[9px] text-brand-gold">${state.activeAssessment ? 'Modo Protección de Examen 🛡️' : 'En línea'}</span>
                </div>
              </div>
              <button onclick="toggleTutor()" class="text-brand-gray hover:text-brand-white text-xs font-bold cursor-pointer">✕</button>
            </div>

            <div class="flex-1 p-3 overflow-y-auto space-y-2 bg-brand-beige/30 text-xs" id="tutor-msg-container">
              ${(state.tutorMessages || []).map(m => `
                <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                  <div class="max-w-[85%] p-2.5 rounded-2xl ${
                    m.role === 'user' 
                      ? 'bg-brand-dark text-brand-white rounded-br-none' 
                      : 'bg-brand-white text-brand-dark border border-brand-gray rounded-bl-none shadow-sm'
                  }">
                    ${m.text}
                  </div>
                </div>
              `).join('')}
            </div>

            <form onsubmit="sendTutorMessage(event)" class="p-2 bg-brand-white border-t border-brand-gray flex gap-2">
              <input
                type="text"
                id="tutor-input"
                placeholder="Pregunta algo al tutor..."
                class="flex-1 text-xs p-2 bg-brand-beige rounded-xl border border-brand-gray outline-none focus:border-brand-gold text-brand-dark font-medium"
                required
              />
              <button type="submit" class="bg-brand-gold text-brand-dark px-3 rounded-xl font-bold text-xs cursor-pointer hover:bg-brand-dark hover:text-white transition">
                ➤
              </button>
            </form>
          </div>
        ` : ''}
      `;
    }

    function renderBottomNav() {
      return `
        <nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-brand-white border-t border-brand-gray flex items-center justify-around z-40 max-w-md mx-auto shadow-lg">
          <button
            onclick="setTab('home')"
            class="flex flex-col items-center justify-center w-16 transition cursor-pointer ${state.currentTab === 'home' ? 'text-brand-gold font-black' : 'text-brand-dark/60 font-medium'}"
          >
            <span class="text-xl">🏠</span>
            <span class="text-[10px]">Inicio</span>
          </button>
          <button
            onclick="setTab('path')"
            class="flex flex-col items-center justify-center w-16 transition cursor-pointer ${state.currentTab === 'path' ? 'text-brand-gold font-black' : 'text-brand-dark/60 font-medium'}"
          >
            <span class="text-xl">🗺️</span>
            <span class="text-[10px]">Ruta</span>
          </button>
          <button
            onclick="setTab('profile')"
            class="flex flex-col items-center justify-center w-16 transition cursor-pointer ${state.currentTab === 'profile' ? 'text-brand-gold font-black' : 'text-brand-dark/60 font-medium'}"
          >
            <span class="text-xl">👤</span>
            <span class="text-[10px]">Perfil</span>
          </button>
        </nav>
      `;
    }

    // --- 6. CONTROLADORES DE EVENTOS ---

    function bindAuthEvents() {
      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          const nameInput = document.getElementById('user-name-input');
          const emailInput = document.getElementById('user-email-input');
          
          const name = nameInput ? nameInput.value.trim() : '';
          const email = emailInput ? emailInput.value.trim() : '';
          
          if (!name || !email) return;

          state.isAuth = true;
          state.user = { name, email };
          state.currentTab = 'home';
          saveState();
          render();
        });
      }
    }

    function bindAppEvents() {
      const msgBox = document.getElementById('tutor-msg-container');
      if (msgBox) {
        msgBox.scrollTop = msgBox.scrollHeight;
      }
    }

    function setTab(tab) {
      state.currentTab = tab;
      state.activeLesson = null;
      state.activeAssessment = null;
      saveState();
      render();
    }

    function openLesson(levelId, lessonId) {
      const lvl = COURSE_DATA.find(l => l.id === levelId);
      if (!lvl) return;
      const lsn = lvl.lessons.find(l => l.id === lessonId);
      if (!lsn) return;
      state.activeLesson = { levelId, lessonId, data: lsn, step: 1 };
      render();
    }

    function nextLessonStep() {
      if (!state.activeLesson) return;
      if (state.activeLesson.step < 7) {
        state.activeLesson.step++;
        render();
      } else {
        const lsnId = state.activeLesson.lessonId;
        const xp = state.activeLesson.data?.xpReward || 20;
        if (!state.progress.completedLessons.includes(lsnId)) {
          state.progress.completedLessons.push(lsnId);
          state.progress.xp += xp;
        }
        state.activeLesson = null;
        saveState();
        render();
      }
    }

    function closeLesson() {
      state.activeLesson = null;
      render();
    }

    function checkInteractOption(opt) {
      if (!state.activeLesson || !state.activeLesson.data) return;
      const lsn = state.activeLesson.data;
      const isCorrect = opt === lsn.interactCorrect;
      const box = document.getElementById('lesson-interact-box');
      if (box) {
        box.innerHTML = `
          <div class="p-3 rounded-xl text-xs md:text-sm ${isCorrect ? 'bg-brand-success/15 border border-brand-success' : 'bg-brand-error/15 border border-brand-error'} text-brand-dark">
            <div class="font-bold mb-1">${isCorrect ? '✓ ¡Correcto!' : 'Revisa este concepto:'}</div>
            <div>${lsn.interactExplanation}</div>
          </div>
        `;
      }
    }

    function checkCheckOption(opt) {
      if (!state.activeLesson || !state.activeLesson.data) return;
      const lsn = state.activeLesson.data;
      const isCorrect = opt === lsn.checkAnswer;
      const box = document.getElementById('lesson-check-box');
      if (box) {
        box.innerHTML = `
          <div class="col-span-2 p-3 rounded-xl text-xs md:text-sm bg-brand-beige border border-brand-gray text-brand-dark">
            <div class="font-bold mb-1">${isCorrect ? '✓ ¡Verificación Exitosa!' : 'Retroalimentación:'}</div>
            <div>${lsn.checkExplanation}</div>
          </div>
        `;
      }
    }

    function openAssessment(levelId) {
      state.activeAssessment = { levelId, result: null };
      render();
    }

    function submitAssessment(e) {
      e.preventDefault();
      if (!state.activeAssessment) return;
      const form = document.getElementById('assessment-form');
      if (!form) return;
      const formData = new FormData(form);
      const lvl = COURSE_DATA.find(l => l.id === state.activeAssessment.levelId);
      if (!lvl || !lvl.assessment) return;
      
      let correct = 0;
      const details = {};

      lvl.assessment.questions.forEach(q => {
        const selected = formData.get(q.id);
        const isCorrect = selected === q.correctAnswer;
        if (isCorrect) correct++;
        details[q.id] = {
          isCorrect,
          explanation: isCorrect ? q.feedbackSuccess : q.feedbackFailure
        };
      });

      const score = Math.round((correct / lvl.assessment.questions.length) * 100);
      const passed = score >= lvl.assessment.passingScore;

      if (passed) {
        if (lvl.id === 1) {
          state.progress.level1Passed = true;
          state.progress.level1Score = Math.max(score, state.progress.level1Score);
          state.progress.currentLevel = Math.max(2, state.progress.currentLevel);
        } else if (lvl.id === 2) {
          state.progress.level2Passed = true;
          state.progress.level2Score = Math.max(score, state.progress.level2Score);
        }
        state.progress.xp += lvl.assessment.xpReward;
      } else {
        state.progress.xp += 10;
      }

      state.activeAssessment.result = { score, passed, details };
      saveState();
      render();
    }

    function closeAssessment() {
      state.activeAssessment = null;
      render();
    }

    function toggleTutor() {
      state.tutorOpen = !state.tutorOpen;
      render();
    }

    function sendTutorMessage(e) {
      e.preventDefault();
      const input = document.getElementById('tutor-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      state.tutorMessages.push({ role: 'user', text });
      input.value = '';
      render();

      const lower = text.toLowerCase();
      const isAskingAnswer = lower.includes("respuesta") || lower.includes("opcion") || lower.includes("cual es la") || lower.includes("solucion");

      setTimeout(() => {
        let reply = "Para estructurar un buen socio digital, recuerda definir los 4 pilares: Rol, Tarea, Tono y Candados. ¿Cómo aplicarías esto en tu caso?";

        if (state.activeAssessment && isAskingAnswer) {
          reply = "No puedo darte directamente la respuesta de la evaluación, pero puedo ayudarte a analizar el concepto para que puedas resolverla por ti mismo. ¿Qué parte del enunciado te genera duda?";
        } else if (lower.includes("prompt") || lower.includes("pilar")) {
          reply = "El Prompt Maestro actúa como el cerebro operativo de tu socio. Un pilar esencial son los Candados, que le impiden al asistente alucinar o inventar respuestas.";
        } else if (lower.includes("rag") || lower.includes("archivo") || lower.includes("documento")) {
          reply = "RAG (Generación Aumentada por Recuperación) permite que el socio consulte manuales y PDFs privados sin necesidad de reentrenar el modelo.";
        } else if (lower.includes("humano") || lower.includes("loop")) {
          reply = "El principio 'Human-in-the-Loop' establece que la IA prepara los borradores, pero tú siempre tienes la última palabra y el control de envío.";
        }

        state.tutorMessages.push({ role: 'tutor', text: reply });
        saveState();
        render();
      }, 700);
    }

    function openPremiumModal(title) {
      const modalTitle = document.getElementById('premium-modal-title');
      if (modalTitle) modalTitle.innerText = title || 'Nivel Premium';
      const modal = document.getElementById('premium-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    }

    function closePremiumModal() {
      const modal = document.getElementById('premium-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function resetProgress() {
      if (confirm('¿Deseas reiniciar tu progreso de aprendizaje?')) {
        state.progress = {
          completedLessons: [],
          level1Passed: false,
          level1Score: 0,
          level2Passed: false,
          level2Score: 0,
          xp: 0,
          streak: 1,
          currentLevel: 1
        };
        saveState();
        render();
      }
    }

    function logout() {
      state.isAuth = false;
      saveState();
      render();
    }

    // Inicialización de la aplicación
    render();
  </script>
</body>
</html>
